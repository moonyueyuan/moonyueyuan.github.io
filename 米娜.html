<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>祝福米娜</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f0f8ff;
            font-family: 'KaiTi', '楷体', serif;
            text-align: center;
            padding: 50px 20px;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        h1 {
            color: #e91e63;
            font-size: 28px;
            margin-bottom: 30px;
        }

        .button-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        button {
            background-color: #e91e63;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 18px;
            padding: 12px 30px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
            transform: none;
            opacity: 1;
        }

        .blessing-popup {
            position: fixed;
            width: 220px;
            height: 100px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            z-index: 1000;
            animation: popupAnimation 0.3s ease-out;
        }

        @keyframes popupAnimation {
            from {
                transform: scale(0);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .close-btn {
            position: absolute;
            top: 5px;
            right: 8px;
            background: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
            color: #333;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            padding: 0;
        }

        .close-btn:hover {
            background-color: rgba(0, 0, 0, 0.1);
            color: #e91e63;
        }

        .blessing-text {
            font-size: 14px;
            line-height: 1.4;
            color: #333;
            text-align: center;
            font-weight: bold;
        }

        .special-blessing {
            color: #e91e63 !important;
            font-size: 16px !important;
            animation: heartbeat 1.5s infinite;
        }

        @keyframes heartbeat {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }
        }

        #blessingContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }

        .blessing-popup {
            pointer-events: auto;
        }
    </style>
</head>

<body>
    <h1>点击开始接收祝福吧！</h1>

    <div class="button-container">
        <button id="startBlessing">开启祝福</button>
        <button id="closeAll">关闭所有</button>
    </div>

    <div id="blessingContainer"></div>

    <script>
        // 祝福列表
        const normalBlessings = [
            "期末考试门门都上95",
            "每天都有好心情！",
            "成为最幸运的宝子！",
            "世界上最可爱的人！",
            "天冷了猫，多穿衣服！",
            "幸运降临，猫猫😊",
            "每天都要元气满满哦！",
            "每天都能开开心心！",
            "别熬夜了，猫猫！",
            "保持微笑呀，猫猫！",
            "愿猫猫所有烦恼消失！",
            "好好休息，猫猫！"
        ];

        const specialBlessing = "我会一直一直陪着你！";
        const backgroundColors = [
            "#ffc0cb", "#ffb6c1", "#ff69b4", "#ff1493", "#db7093",
            "#bc8f8f", "#c71585", "#ffa07a", "#ff7f50", "#ffa500",
            "#ffffe0", "#e6e6fa", "#d8bfd8", "#dda0dd", "#ee82ee"
        ];

        let blessingPopups = [];
        let specialBlessingShown = false;

        // 获取DOM元素
        const startBtn = document.getElementById('startBlessing');
        const closeAllBtn = document.getElementById('closeAll');
        const blessingContainer = document.getElementById('blessingContainer');

        // 生成随机位置
        function getRandomPosition() {
            const maxX = window.innerWidth - 240;
            const maxY = window.innerHeight - 120;
            const x = Math.random() * maxX;
            const y = Math.random() * maxY;
            return { x, y };
        }

        // 创建祝福弹窗
        function createBlessingPopup(index) {
            const popup = document.createElement('div');
            popup.className = 'blessing-popup';

            // 随机背景色
            const randomColor = backgroundColors[Math.floor(Math.random() * backgroundColors.length)];
            popup.style.backgroundColor = randomColor;

            // 随机位置
            const position = getRandomPosition();
            popup.style.left = position.x + 'px';
            popup.style.top = position.y + 'px';

            // 创建关闭按钮
            const closeBtn = document.createElement('button');
            closeBtn.className = 'close-btn';
            closeBtn.innerHTML = '×';
            closeBtn.onclick = function () {
                closePopup(popup);
            };

            // 创建祝福文本
            const blessingText = document.createElement('div');
            blessingText.className = 'blessing-text';

            // 10%概率显示特殊祝福，且只能显示一次
            if (!specialBlessingShown && Math.random() < 0.1) {
                blessingText.textContent = specialBlessing;
                blessingText.classList.add('special-blessing');
                specialBlessingShown = true;
            } else {
                const randomBlessing = normalBlessings[Math.floor(Math.random() * normalBlessings.length)];
                blessingText.textContent = randomBlessing;
            }

            popup.appendChild(closeBtn);
            popup.appendChild(blessingText);

            blessingContainer.appendChild(popup);
            blessingPopups.push(popup);

            // 添加点击弹窗本身也可以关闭的功能
            popup.onclick = function (e) {
                if (e.target === popup || e.target === blessingText) {
                    closePopup(popup);
                }
            };
        }

        // 关闭单个弹窗
        function closePopup(popup) {
            const index = blessingPopups.indexOf(popup);
            if (index > -1) {
                blessingPopups.splice(index, 1);
            }
            popup.style.animation = 'popupAnimation 0.3s ease-out reverse';
            setTimeout(() => {
                if (popup.parentNode) {
                    popup.parentNode.removeChild(popup);
                }
            }, 300);
        }

        // 关闭所有弹窗
        function closeAllPopups() {
            blessingPopups.forEach(popup => {
                if (popup.parentNode) {
                    popup.parentNode.removeChild(popup);
                }
            });
            blessingPopups = [];
            specialBlessingShown = false;
        }

        // 开启祝福
        function startBlessing() {
            startBtn.disabled = true;
            startBtn.textContent = '祝福发送中...';

            let count = 0;
            const interval = setInterval(() => {
                createBlessingPopup(count);
                count++;

                if (count >= 100) {
                    clearInterval(interval);
                    // 5秒后恢复按钮
                    setTimeout(() => {
                        startBtn.disabled = false;
                        startBtn.textContent = '开启祝福';
                    }, 5000);
                }
            }, 50);
        }

        // 绑定事件
        startBtn.addEventListener('click', startBlessing);
        closeAllBtn.addEventListener('click', () => {
            closeAllPopups();
            startBtn.disabled = false;
            startBtn.textContent = '开启祝福';
        });

        // 防止弹窗在窗口大小改变时超出屏幕
        window.addEventListener('resize', () => {
            blessingPopups.forEach(popup => {
                const rect = popup.getBoundingClientRect();
                if (rect.right > window.innerWidth) {
                    popup.style.left = (window.innerWidth - 240) + 'px';
                }
                if (rect.bottom > window.innerHeight) {
                    popup.style.top = (window.innerHeight - 120) + 'px';
                }
            });
        });
    </script>
</body>

</html>
